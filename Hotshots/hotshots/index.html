<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10120f" />
    <meta name="description" content="HotShots — make better drinks with what you have." />
    <title>HotShots</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <main class="app-shell" aria-label="HotShots cocktail companion">
      <header class="topbar">
        <button class="brand" data-nav="summary" aria-label="Go to dashboard">
          <span class="brand-mark" aria-hidden="true">H</span>
          <span>hotshots</span>
        </button>
        <div class="topbar-actions">
          <button class="avatar" data-nav="account" aria-label="Open account">KM</button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>

      <nav class="bottom-dock" aria-label="Primary navigation">
        <span class="nav-glide" aria-hidden="true"></span>
        <button data-nav="summary" class="nav-item active"><span aria-hidden="true">⌂</span><b>Home</b></button>
        <button data-nav="create" class="nav-item"><span aria-hidden="true">＋</span><b>Create</b></button>
        <button data-nav="explore" class="nav-item"><span aria-hidden="true">⌕</span><b>Explore</b></button>
        <button data-nav="bar" class="nav-item"><span aria-hidden="true">▦</span><b>My bar</b></button>
        <button data-nav="favourites" class="nav-item"><span aria-hidden="true">♡</span><b>Saved</b></button>
      </nav>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
